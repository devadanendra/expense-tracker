<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<h2>Polished: Stone & Ink, every screen</h2>
<p class="subtitle">Refinements: clearer hierarchy (note first, category second), month-vs-last-month hint, date chips instead of a date field, a category grid, plus Reports and Settings drawn in the same system. English, no mascot.</p>

<style>
.dir{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:20px 8px}
.ph{width:260px;height:540px;border-radius:34px;overflow:hidden;position:relative;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);box-shadow:0 10px 30px rgba(0,0,0,.18);-webkit-font-smoothing:antialiased;font-size:14px}
.ph *{box-sizing:border-box}
.cap0{text-align:center;font:600 12px "Plus Jakarta Sans",sans-serif;color:#9a948c;margin-top:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hd{background:var(--hd);padding:18px 20px 38px}
.top{display:flex;justify-content:space-between;align-items:center}
.mo{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:600}
.mo svg{width:16px;height:16px;color:var(--mu)}
.ib{width:36px;height:36px;border-radius:50%;background:var(--ib);display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.ib svg{width:16px;height:16px}
.lbl{font-size:12px;color:var(--mu);font-weight:500;margin-top:18px}
.big{font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.big .rp{font-size:17px;font-weight:500;color:var(--mu);letter-spacing:0;margin-right:5px;vertical-align:5px}
.vs{font-size:12px;color:var(--mu);margin-top:4px}.vs b{color:var(--good);font-weight:600}
.strip{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:14px}
.strip i{flex:1;border-radius:2px;background:var(--bar)}
.strip i.t{background:var(--ac)}.strip i.f{background:var(--barF);height:3px!important}
.sc{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:6px}
.body{position:absolute;left:0;right:0;bottom:0;background:var(--bg2);border-radius:24px 24px 0 0;padding:4px 14px 90px}
.dh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mu);padding:14px 4px 6px}
.lst{background:var(--surf);border-radius:18px;padding:0 12px;box-shadow:var(--sh1)}
.row{display:flex;align-items:center;gap:11px;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.chip{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.chip svg{width:16px;height:16px;stroke-width:2}
.mid{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.nav{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border-radius:30px;background:var(--nav);box-shadow:var(--sh2);backdrop-filter:blur(16px)}
.nav .t{height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--mu)}
.nav .t.on{background:var(--bg2);color:var(--tx)}
.nav .p{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--onAc);display:flex;align-items:center;justify-content:center}
.nav .p svg{width:22px;height:22px;stroke-width:2.2}
.empty{text-align:center;padding:48px 20px 0}
.empty .ring{width:56px;height:56px;border-radius:50%;background:var(--surf);box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--mu)}
.empty h5{margin:14px 0 4px;font-size:15px;font-weight:600}
.empty p{margin:0;font-size:13px;color:var(--mu);line-height:1.5}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(20,18,16,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:30px;background:var(--surf);border-radius:24px 24px 0 0;padding:8px 14px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sh{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.x{width:32px;height:32px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--mu)}
.x svg{width:15px;height:15px}
.amtIn{text-align:center;font-size:40px;font-weight:600;letter-spacing:-.035em;margin-top:6px}
.amtIn .rp{font-size:17px;color:var(--mu);font-weight:500;letter-spacing:0;margin-right:5px;vertical-align:8px}
.expr{text-align:center;font-size:12px;color:var(--mu);height:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px;margin:10px 0 6px}
.gc{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--mu);padding:3px 0;border-radius:12px}
.gc .chip{width:34px;height:34px}
.gc.sel{color:var(--tx);font-weight:600}
.gc.sel .chip{box-shadow:0 0 0 2px var(--surf),0 0 0 4px var(--ac)}
.chips{display:flex;gap:6px;margin-top:4px}
.dc{height:32px;padding:0 10px;border-radius:16px;background:var(--bg2);display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--mu)}
.dc.on{background:var(--tx);color:var(--surf)}
.dc svg{width:14px;height:14px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 4px;margin-top:6px}
.k{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500}
.k.op{color:var(--ac);font-size:16px}
.k.go{grid-row:span 2;height:auto;background:var(--ac);color:var(--onAc);border-radius:14px}
.k.go svg{width:24px;height:24px;stroke-width:2.2}
/* reports */
.seg{display:flex;background:var(--ib);border-radius:12px;padding:3px;margin-top:16px}
.seg span{flex:1;text-align:center;height:32px;line-height:32px;border-radius:9px;font-size:12px;font-weight:600;color:var(--mu)}
.seg span.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh1)}
.bar2{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:4px}
.wk{display:flex;align-items:flex-end;gap:10px;height:110px;padding:12px 6px 0}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mu)}
.wk i{width:100%;border-radius:8px;background:var(--bar)}
.wk .cur i{background:var(--ac)}.wk .cur{color:var(--tx);font-weight:600}
/* settings */
.sg{font-size:12px;font-weight:600;color:var(--mu);padding:16px 4px 6px}
.sr{display:flex;align-items:center;gap:11px;min-height:50px}
.sr+.sr{border-top:1px solid var(--line)}
.sr .ico{width:30px;height:30px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.sr .ico svg{width:15px;height:15px}
.sr .v{margin-left:auto;font-size:12px;color:var(--mu);display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
/* tokens */
.L{--bg:#e9e5de;--bg2:#f5f3ef;--hd:#e9e5de;--surf:#fff;--tx:#1c1917;--mu:#78716c;--line:#ece8e2;--ib:rgba(28,25,23,.07);--bar:#cfc9bf;--barF:#ddd8d0;--nav:rgba(255,255,255,.92);--ac:#3a4bd8;--onAc:#fff;--good:#3f7a5f;--sh1:0 1px 2px rgba(28,25,23,.05),0 2px 8px rgba(28,25,23,.04);--sh2:0 8px 24px rgba(28,25,23,.16)}
.D{--bg:#26221e;--bg2:#141210;--hd:#26221e;--surf:#1f1c19;--tx:#f5f3ef;--mu:#a8a29e;--line:#2e2a26;--ib:rgba(255,255,255,.08);--bar:#4a443e;--barF:#35302b;--nav:rgba(40,36,32,.94);--ac:#8b97ff;--onAc:#141210;--good:#7fc4a0;--sh1:none;--sh2:0 8px 24px rgba(0,0,0,.5)}
</style>

<div id="screens"></div>

<script>
(function(){
const I={
 food:'<path d="M3 11h18M5 11l1 9h12l1-9M9 7a3 3 0 0 1 6 0"/>',
 car:'<rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
 cart:'<path d="M6 6h15l-2 9H8L6 3H3"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
 bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 bag:'<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
 home:'<path d="M3 11 12 4l9 7v9H3z"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 play:'<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 note:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="m5 12 5 5L20 7"/>',back:'<path d="M20 12H8l4-4M8 12l4 4"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',dd:'<path d="m6 9 6 6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="8" cy="8" r="1.5"/>',dl:'<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>',
 ul:'<path d="M12 20V8M6 13l6-6 6 6M4 4h16"/>',cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"/>',
 inbox:'<path d="M3 13h5l1 3h6l1-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const C={food:'#c2643c',car:'#b8862b',cart:'#4d7c6b',bill:'#6b62b5',bag:'#a85a7a',home:'#7a6a55',heart:'#c0504d',play:'#3f7fa0'};
const chip=(n,s='')=>`<div class="chip" style="background:${C[n]};${s}">${ic(n)}</div>`;
const R=(n,a,b,amt)=>`<div class="row">${chip(n)}<div class="mid"><div class="t1">${a}</div><div class="t2">${b}</div></div><div class="amt num">${amt}</div></div>`;
const days=[40,10,65,22,18,90,30,12,55,20,8,70,35];
const strip=e=>`<div class="strip">${Array.from({length:31},(_,i)=>i>12?'<i class="f"></i>':`<i class="${i===12?'t':''}" style="height:${e?6:Math.max(8,days[i])}%"></i>`).join('')}</div><div class="sc"><span>Oct 1</span><span>Today</span><span>Oct 31</span></div>`;
const nav=on=>`<div class="nav"><span class="t ${on==='tx'?'on':''}">Transactions</span><span class="p">${ic('plus')}</span><span class="t ${on==='rp'?'on':''}">Reports</span></div>`;
const head=(e)=>`<div class="hd"><div class="top"><div class="mo">October 2026${ic('dd')}</div><div><span class="ib">${ic('search')}</span><span class="ib">${ic('gear')}</span></div></div>
 <div class="lbl">Spent this month</div><div class="big num"><span class="rp">Rp</span>${e?'0':'2.450.000'}</div>
 ${e?'<div class="vs">&nbsp;</div>':'<div class="vs"><b>↓ Rp 310.000</b> vs last month</div>'}${strip(e)}</div>`;
const home=m=>`<div class="ph ${m}">${head(false)}<div class="body" style="top:248px">
 <div class="dh"><span>Today · Tue 13</span><span class="num">Rp 59.000</span></div>
 <div class="lst">${R('food','Nasi padang','Food & Drink · 12:40','35.000')}${R('car','Gojek to office','Transport · 08:15','24.000')}</div>
 <div class="dh"><span>Yesterday · Mon 12</span><span class="num">Rp 112.500</span></div>
 <div class="lst">${R('cart','Indomaret','Groceries · 19:02','112.500')}</div>
 </div>${nav('tx')}</div>`;
const empty=m=>`<div class="ph ${m}">${head(true)}<div class="body" style="top:248px"><div class="empty"><div class="ring">${ic('inbox')}</div><h5>No expenses yet</h5><p>Tap + to log your first one.</p></div></div>${nav('tx')}</div>`;
const add=m=>`<div class="ph ${m}"><div class="scrim"></div><div class="sheet">
 <div class="grab"></div><div class="sh"><span>New expense</span><span class="x">${ic('x')}</span></div>
 <div class="amtIn num"><span class="rp">Rp</span>59.000</div><div class="expr num">35.000 + 24.000</div>
 <div class="grid">${[['food','Food'],['car','Transport'],['cart','Groceries'],['bill','Bills'],['bag','Shopping'],['home','Home'],['heart','Health'],['play','Fun']].map(([n,l],i)=>`<div class="gc ${i===0?'sel':''}">${chip(n)}${l}</div>`).join('')}</div>
 <div class="chips"><span class="dc on">Today</span><span class="dc">Yesterday</span><span class="dc">${ic("cal")}</span><span class="dc" style="margin-left:auto">${ic('note')}Note</span></div>
 <div class="pad num">
  <div class="k op">AC</div><div class="k op">÷</div><div class="k op">×</div><div class="k op">${ic('back')}</div>
  <div class="k">7</div><div class="k">8</div><div class="k">9</div><div class="k op">−</div>
  <div class="k">4</div><div class="k">5</div><div class="k">6</div><div class="k op">+</div>
  <div class="k">1</div><div class="k">2</div><div class="k">3</div><div class="k go">${ic('check')}</div>
  <div class="k">0</div><div class="k">000</div><div class="k"></div>
 </div></div></div>`;
const cats=[['food','Food & Drink',980000,40],['bill','Bills',590000,24],['car','Transport',392000,16],['cart','Groceries',294000,12],['bag','Shopping',194000,8]];
const reports=m=>`<div class="ph ${m}"><div class="hd" style="padding-bottom:30px"><div class="top"><div class="mo">October 2026${ic('dd')}</div></div>
 <div class="lbl">Spent this month</div><div class="big num"><span class="rp">Rp</span>2.450.000</div>
 <div class="seg"><span class="on">Categories</span><span>Weeks</span></div></div>
 <div class="body" style="top:196px"><div class="lst" style="margin-top:12px;padding:4px 12px 8px">
 ${cats.map(([n,l,v,p])=>`<div style="padding:9px 0"><div style="display:flex;align-items:center;gap:10px">${chip(n,'width:28px;height:28px')}<span class="t1" style="flex:1;font-size:13px">${l}</span><span class="amt num" style="font-size:13px;margin-left:8px">${v.toLocaleString('id-ID')}</span></div><div class="bar2"><i style="width:${p*2.2}%;background:${C[n]}"></i></div></div>`).join('')}
 </div></div>${nav('rp')}</div>`;
const weeks=m=>`<div class="ph ${m}"><div class="hd" style="padding-bottom:30px"><div class="top"><div class="mo">October 2026${ic('dd')}</div></div>
 <div class="lbl">Spent this month</div><div class="big num"><span class="rp">Rp</span>2.450.000</div>
 <div class="seg"><span>Categories</span><span class="on">Weeks</span></div></div>
 <div class="body" style="top:196px"><div class="lst" style="margin-top:12px;padding:6px 12px 12px">
 <div class="wk">${[['1–7',70],['8–14',100],['15–21',0],['22–28',0],['29–31',0]].map(([l,h],i)=>`<div class="${i===1?'cur':''}"><i style="height:${h?Math.round(h*0.7):3}px;${h?'':'background:var(--line)'}"></i>${l}</div>`).join('')}</div>
 </div>
 <div class="lst" style="margin-top:10px">${[['Oct 1–7','Rp 1.120.000'],['Oct 8–14','Rp 1.330.000']].map(([a,b])=>`<div class="sr"><span class="t1" style="flex:1">${a}</span><span class="amt num">${b}</span></div>`).join('')}</div>
 </div>${nav('rp')}</div>`;
const settings=m=>`<div class="ph ${m}" style="background:var(--bg2)"><div style="padding:18px 18px 0;display:flex;align-items:center;gap:10px"><span class="x" style="background:var(--surf)">${ic('x')}</span><span style="font-size:20px;font-weight:600;letter-spacing:-.02em">Settings</span></div>
 <div style="padding:0 14px">
 <div class="sg">Data safety</div><div class="lst">
  <div class="sr"><span class="ico">${ic('cloud')}</span><div class="mid"><div class="t1">Google Sheet sync</div><div class="t2">Synced 2 min ago</div></div><span class="v"><span class="dot"></span>On</span></div>
  <div class="sr"><span class="ico">${ic('back')}</span><div class="mid"><div class="t1">Restore from Sheet</div></div><span class="v">${ic('r')}</span></div></div>
 <div class="sg">Data</div><div class="lst">
  <div class="sr"><span class="ico">${ic('dl')}</span><div class="mid"><div class="t1">Export CSV</div><div class="t2">1.284 expenses</div></div><span class="v">${ic('r')}</span></div>
  <div class="sr"><span class="ico">${ic('ul')}</span><div class="mid"><div class="t1">Import CSV</div></div><span class="v">${ic('r')}</span></div></div>
 <div class="sg">General</div><div class="lst">
  <div class="sr"><span class="ico">${ic('tag')}</span><div class="mid"><div class="t1">Categories</div></div><span class="v">12 ${ic('r')}</span></div></div>
 </div></div>`;
const S=[[home,'L','Home'],[add,'L','Add expense'],[reports,'L','Reports · categories'],[weeks,'L','Reports · weeks'],[settings,'L','Settings'],[empty,'L','Empty month'],[home,'D','Home · dark'],[add,'D','Add · dark']];
document.getElementById('screens').innerHTML=`<div class="dir">${S.map(([f,m,l])=>`<div>${f(m)}<div class="cap0">${l}</div></div>`).join('')}</div>`;
})();
</script>
